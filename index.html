<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>سفرة — اطلب أكلك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" />
  <!-- Telegram Mini App SDK — must load before the app boots -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <!--
    Pre-boot loader: painted from static HTML/CSS the instant the page
    parses, BEFORE the JS bundle downloads or React mounts. It stays
    deliberately neutral: no tenant colors, names, product placeholders,
    or business-type icons appear before tenant initialization finishes.
  -->
  <style>
    :root {
      --boot-bg: #f6f6f4;
      --boot-fg: #5f646b;
    }
    #preboot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      gap: 20px;
      background: var(--boot-bg);
      color: var(--boot-fg);
      font-family: 'Tajawal', system-ui, sans-serif;
      transition: opacity 0.35s ease;
    }
    #preboot .pb-mark {
      width: 48px; height: 48px; border-radius: 50%;
      border: 3px solid rgba(95, 100, 107, 0.18);
      border-top-color: currentColor;
      animation: pb-spin 0.85s linear infinite;
    }
    #preboot .pb-dots { display: flex; gap: 8px; }
    #preboot .pb-dots i {
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
      display: inline-block; animation: pb-pulse 1s ease-in-out infinite;
      opacity: 0.36;
    }
    #preboot .pb-dots i:nth-child(2) { animation-delay: 0.15s; }
    #preboot .pb-dots i:nth-child(3) { animation-delay: 0.3s; }
    @media (prefers-color-scheme: dark) {
      :root { --boot-bg: #121316; --boot-fg: #d8dadd; }
      #preboot .pb-mark { border-color: rgba(216, 218, 221, 0.18); border-top-color: currentColor; }
    }
    @keyframes pb-spin { to{transform:rotate(360deg)} }
    @keyframes pb-pulse { 0%,100%{opacity:0.28} 50%{opacity:0.9} }
  </style>

  <div id="preboot">
    <div class="pb-mark" aria-hidden="true"></div>
    <div class="pb-dots"><i></i><i></i><i></i></div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
