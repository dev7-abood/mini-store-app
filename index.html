<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>سفرة — اطلب أكلك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" />
  <!-- Telegram Mini App SDK — must load before the app boots -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <!--
    Pre-boot loader: painted from static HTML/CSS the instant the page
    parses, BEFORE the JS bundle downloads or React mounts. It stays
    deliberately neutral: no tenant colors, names, product placeholders,
    or business-type icons appear before tenant initialization finishes.
  -->
  <style>
    :root {
      --boot-bg-top: #ffffff;
      --boot-bg-mid: #fbfcfe;
      --boot-bg-bottom: #f2f5f9;
      --boot-glow-top: rgba(217, 227, 246, 0.74);
      --boot-glow-bottom: rgba(232, 244, 240, 0.72);
      --boot-fg: #46515f;
    }
    #preboot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      background:
        radial-gradient(circle at 50% 25%, var(--boot-glow-top), transparent 35%),
        radial-gradient(circle at 43% 62%, var(--boot-glow-bottom), transparent 34%),
        linear-gradient(180deg, var(--boot-bg-top) 0%, var(--boot-bg-mid) 48%, var(--boot-bg-bottom) 100%);
      color: var(--boot-fg);
      font-family: 'Tajawal', system-ui, sans-serif;
      transition: opacity 0.35s ease;
    }
    #preboot .pb-bars {
      width: 58px; height: 36px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid rgba(70, 81, 95, 0.08);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 18px 46px rgba(38, 48, 61, 0.1);
      backdrop-filter: blur(12px);
    }
    #preboot .pb-bars i {
      width: 5px; height: 16px; border-radius: 999px;
      background: currentColor;
      display: inline-block; animation: pb-bar-pulse 0.9s ease-in-out infinite;
      opacity: 0.38;
      transform-origin: center;
    }
    #preboot .pb-bars i:nth-child(2) { animation-delay: 0.12s; }
    #preboot .pb-bars i:nth-child(3) { animation-delay: 0.24s; }
    @media (prefers-color-scheme: dark) {
      :root {
        --boot-bg-top: #ffffff;
        --boot-bg-mid: #fbfcfe;
        --boot-bg-bottom: #f2f5f9;
        --boot-glow-top: rgba(217, 227, 246, 0.68);
        --boot-glow-bottom: rgba(232, 244, 240, 0.66);
        --boot-fg: #46515f;
      }
    }
    @keyframes pb-bar-pulse {
      0%,100%{opacity:0.32;transform:scaleY(0.55)}
      50%{opacity:0.92;transform:scaleY(1)}
    }
  </style>

  <div id="preboot">
    <div class="pb-bars" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
