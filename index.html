<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>سفرة — اطلب أكلك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" />
  <!-- Telegram Mini App SDK — must load before the app boots -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <!--
    Pre-boot loader: painted from static HTML/CSS the instant the page
    parses, BEFORE the JS bundle downloads or React mounts. It stays
    deliberately neutral: no tenant colors, names, product placeholders,
    or business-type icons appear before tenant initialization finishes.
  -->
  <style>
    :root {
      --boot-bg-top: #fafaf8;
      --boot-bg-bottom: #f1f2f4;
      --boot-glow: rgba(112, 119, 132, 0.14);
      --boot-fg: #5f6671;
    }
    #preboot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      background:
        radial-gradient(circle at 50% 32%, var(--boot-glow), transparent 34%),
        linear-gradient(180deg, var(--boot-bg-top) 0%, var(--boot-bg-bottom) 100%);
      color: var(--boot-fg);
      font-family: 'Tajawal', system-ui, sans-serif;
      transition: opacity 0.35s ease;
    }
    #preboot .pb-bars { display: flex; align-items: center; justify-content: center; gap: 6px; }
    #preboot .pb-bars i {
      width: 5px; height: 18px; border-radius: 999px;
      background: currentColor;
      display: inline-block; animation: pb-bar-pulse 0.9s ease-in-out infinite;
      opacity: 0.42;
      transform-origin: center;
    }
    #preboot .pb-bars i:nth-child(2) { animation-delay: 0.12s; }
    #preboot .pb-bars i:nth-child(3) { animation-delay: 0.24s; }
    @media (prefers-color-scheme: dark) {
      :root {
        --boot-bg-top: #151820;
        --boot-bg-bottom: #0f1115;
        --boot-glow: rgba(82, 91, 110, 0.16);
        --boot-fg: #d8dce3;
      }
    }
    @keyframes pb-bar-pulse {
      0%,100%{opacity:0.32;transform:scaleY(0.55)}
      50%{opacity:0.92;transform:scaleY(1)}
    }
  </style>

  <div id="preboot">
    <div class="pb-bars" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
