<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>سفرة — اطلب أكلك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=block" />
  <!-- Telegram Mini App SDK — must load before the app boots -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <!--
    Pre-boot loader: painted from static HTML/CSS the instant the page
    parses, BEFORE the JS bundle downloads or React mounts. It stays
    deliberately neutral: no tenant colors, names, product placeholders,
    or business-type icons appear before tenant initialization finishes.
  -->
  <style>
    :root {
      --boot-bg-top: #ffffff;
      --boot-bg-mid: #fbfcfe;
      --boot-bg-bottom: #f5f7fb;
      --boot-glow-top: rgba(226, 234, 248, 0.9);
      --boot-glow-bottom: rgba(235, 247, 244, 0.68);
      --boot-fg: #46515f;
    }
    #preboot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      background:
        radial-gradient(ellipse at 50% 28%, var(--boot-glow-top), transparent 42%),
        radial-gradient(circle at 48% 70%, var(--boot-glow-bottom), transparent 36%),
        linear-gradient(180deg, var(--boot-bg-top) 0%, var(--boot-bg-mid) 55%, var(--boot-bg-bottom) 100%);
      color: var(--boot-fg);
      font-family: 'Noto Sans Arabic', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      transition: opacity 0.35s ease;
    }
    #preboot .pb-bars {
      width: 52px; height: 34px;
      display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    #preboot .pb-bars i {
      width: 6px; height: 20px; border-radius: 999px;
      background: linear-gradient(180deg, #7e8ca0 0%, #46515f 100%);
      box-shadow: 0 8px 18px rgba(70, 81, 95, 0.16);
      display: inline-block; animation: pb-bar-pulse 0.95s ease-in-out infinite;
      opacity: 0.36;
      transform-origin: center;
    }
    #preboot .pb-bars i:nth-child(2) { animation-delay: 0.12s; }
    #preboot .pb-bars i:nth-child(3) { animation-delay: 0.24s; }
    @media (prefers-color-scheme: dark) {
      :root {
        --boot-bg-top: #ffffff;
        --boot-bg-mid: #fbfcfe;
        --boot-bg-bottom: #f5f7fb;
        --boot-glow-top: rgba(226, 234, 248, 0.9);
        --boot-glow-bottom: rgba(235, 247, 244, 0.68);
        --boot-fg: #46515f;
      }
    }
    @keyframes pb-bar-pulse {
      0%,100%{opacity:0.32;transform:translateY(2px) scaleY(0.52)}
      50%{opacity:0.95;transform:translateY(-1px) scaleY(1)}
    }
  </style>

  <div id="preboot">
    <div class="pb-bars" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
